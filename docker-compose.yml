# Local/production preview of the built frontend.
#   docker compose up --build      # build and run
#   docker compose down            # stop
# Values come from `.env` (see `.env.example`).
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api}
    image: utn-rh-frontend:${IMAGE_TAG:-local}
    container_name: utn-rh-web
    ports:
      - "${APP_PORT:-4200}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
