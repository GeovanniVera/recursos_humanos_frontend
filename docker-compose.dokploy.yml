services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-/api}
        NGINX_CONF: docker/nginx.dokploy.conf
    image: utn-rh-frontend:${IMAGE_TAG:-prod}
    expose:
      - "80"
    networks:
      - dokploy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  dokploy-network:
    external: true
