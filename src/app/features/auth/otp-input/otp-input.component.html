<label class="sr-only" [id]="labelId" [attr.for]="boxId(0)">
  Código de verificación de seis dígitos
</label>

<div
  class="boxes"
  [class.is-invalid]="isInvalid()"
  role="group"
  [attr.aria-labelledby]="labelId"
>
  @for (index of indices; track index) {
    <input
      #box
      class="box"
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
      maxlength="1"
      [id]="boxId(index)"
      [attr.autocomplete]="index === 0 ? 'one-time-code' : 'off'"
      [attr.aria-label]="'Dígito ' + (index + 1) + ' de 6'"
      [attr.aria-invalid]="isInvalid() ? 'true' : null"
      [value]="digitAt(index)"
      [disabled]="disabled()"
      (input)="onInput(index, $event)"
      (keydown)="onKeydown(index, $event)"
      (paste)="onPaste(index, $event)"
    />
  }
</div>
