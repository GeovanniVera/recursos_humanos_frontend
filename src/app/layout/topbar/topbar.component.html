@if (isMobile()) {
  <button
    #menuBtn
    type="button"
    class="menu-btn"
    aria-controls="app-sidebar-drawer"
    [attr.aria-expanded]="mobileOpen()"
    [attr.aria-label]="mobileOpen() ? 'Cerrar menú' : 'Abrir menú'"
    (click)="toggleMobileMenu()"
  >
    <svg
      class="menu-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M4 7h16" />
      <path d="M4 12h16" />
      <path d="M4 17h16" />
    </svg>
  </button>
}

<nav class="breadcrumb" aria-label="Ruta de navegación">
  <ol class="trail">
    @for (crumb of crumbs(); track crumb.url; let last = $last) {
      <li class="trail-item">
        @if (last) {
          <!--
            The step you are on answers in the archive voice: typed, with the
            weight of a stamped entry. `is-current` is the state (`aria-current`
            twin); `is-typed` is what gives it that voice.
          -->
          <span class="crumb is-current is-typed" aria-current="page">{{ crumb.label }}</span>
        } @else {
          <a class="crumb is-link" [routerLink]="crumb.url">{{ crumb.label }}</a>
          <span class="separator" aria-hidden="true"></span>
        }
      </li>
    }
  </ol>
</nav>

@if (showShortcut()) {
  <!--
    The way into the drawer without the mouse, printed like a note taped to the
    index head. It is not a control: the shortcut itself lives in the drawer,
    and on mobile the drawer is a layer that the note would not explain.
  -->
  <p class="shortcut">Archivero: Ctrl+B</p>
}

<time class="clock" [attr.datetime]="iso()">{{ clock() }}</time>
