<!--
  The card closes the sheet: initials, name, role seal and the way out.
  In the rail there is no room for labels, so the row keeps the avatar alone and
  the exit becomes a 44px square under it — the drawer's own tooltip names it on
  hover and on focus, and `aria-label` carries it for everyone else.
-->
<div class="card" [class.is-rail]="collapsed()">
  <div class="row">
    <span class="avatar" aria-hidden="true">{{ initials() }}</span>

    @if (!collapsed()) {
      <span class="identity">
        <span class="name">{{ name() }}</span>
        <span class="role-stamp">{{ role() }}</span>
      </span>
    }
  </div>

  <button
    type="button"
    class="signout"
    [class.is-icon]="collapsed()"
    data-tooltip-key="logout"
    [attr.aria-label]="collapsed() ? 'Cerrar sesión' : null"
    [attr.title]="collapsed() ? 'Cerrar sesión' : null"
    [attr.aria-describedby]="collapsed() ? tooltipId() : null"
    (click)="confirming.set(true)"
  >
    <svg
      class="signout-icon"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" />
      <path d="M9 8l-4 4 4 4" />
      <path d="M5 12h10" />
    </svg>

    @if (!collapsed()) {
      <span>Cerrar sesión</span>
    }
  </button>
</div>

<!--
  Signing out is destructive: it throws away the token of this device. The
  sentence names the person so the confirmation cannot be answered blind, and
  it is written in Mexican tuteo like the rest of the interface.
-->
<app-modal title="Cerrar sesión" [(open)]="confirming">
  <p>Vas a cerrar la sesión de <strong>{{ name() }}</strong> en este dispositivo.</p>

  <ng-template #actions>
    <app-button variant="secondary" (click)="confirming.set(false)">Cancelar</app-button>
    <app-button variant="primary" (click)="confirmSignOut()">Cerrar sesión</app-button>
  </ng-template>
</app-modal>
