<div class="shell" [class.is-collapsed]="collapsed()">
  @if (isMobile() && mobileOpen()) {
    <div class="scrim" aria-hidden="true" (click)="closeMobile(true)"></div>
  }

  <app-sidebar
    id="app-sidebar-drawer"
    class="sidebar"
    [attr.inert]="isMobile() && !mobileOpen() ? '' : null"
    [attr.aria-hidden]="isMobile() && !mobileOpen() ? 'true' : null"
    (mobileClose)="closeMobile(true)"
  />

  <div class="content">
    <app-topbar />

    <main class="stage">
      <router-outlet />
    </main>
  </div>
</div>
