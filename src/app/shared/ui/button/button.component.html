<button
  [class]="buttonClass()"
  [type]="type()"
  [disabled]="isDisabled()"
  [attr.aria-busy]="loading() ? 'true' : null"
>
  <svg
    class="spinner"
    viewBox="0 0 16 16"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    aria-hidden="true"
  >
    <circle cx="8" cy="8" r="5.5" opacity="0.25" />
    <path d="M8 2.5A5.5 5.5 0 0 1 13.5 8" stroke-linecap="round" />
  </svg>
  <ng-content />
</button>
